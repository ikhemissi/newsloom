[project]
name = "newsloom"
version = "0.1.0"
description = "Curated AI news for MCP clients, research agents, and people."
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=1.19",
    "newsloom-core",
    "newsloom-enrichment",
    "newsloom-ingestion",
    "newsloom-mcp",
    "newsloom-platform",
    "pre-commit>=4.3",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-cov>=6.2",
    "ruff>=0.14",
]

[tool.uv]
package = false
required-version = ">=0.13.5"

[tool.uv.workspace]
members = ["packages/*", "services/*"]

[tool.uv.sources]
newsloom-core = { workspace = true }
newsloom-ingestion = { workspace = true }
newsloom-enrichment = { workspace = true }
newsloom-mcp = { workspace = true }
newsloom-platform = { workspace = true }

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.mypy]
python_version = "3.15"
strict = true
plugins = ["pydantic.mypy"]
files = ["packages", "services", "scripts", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests/azure"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-config --strict-markers"
markers = [
    "integration: requires local PostgreSQL or other explicitly started dependencies",
    "azure: requires an explicitly selected Azure environment and federated identity",
]

[tool.coverage.run]
branch = true
source = ["newsloom_core", "scripts"]

[tool.coverage.report]
show_missing = true
skip_empty = true
