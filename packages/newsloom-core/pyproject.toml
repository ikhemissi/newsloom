[project]
name = "newsloom-core"
version = "0.1.0"
description = "Shared typed configuration and domain foundations for Newsloom."
requires-python = ">=3.15,<3.16"
dependencies = ["azure-core>=1.35,<2", "httpx>=0.28,<1", "pydantic>=2.12,<3"]

[project.scripts]
newsloom-validate-feeds = "newsloom_core.feeds:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
