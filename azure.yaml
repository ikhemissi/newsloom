# yaml-language-server: $schema=https://aka.ms/azure-dev/schema.json
name: newsloom
metadata:
  template: newsloom
infra:
  provider: terraform
  layers:
    - name: agent-evaluation
      path: infra/agent-evaluation
      dependsOn:
        - application
      hooks:
        preprovision:
          shell: sh
          run: uv run --locked newsloom-platform prepare-agent-evaluation-layer
          interactive: false
          continueOnError: false
    - name: agent-identity
      path: infra/agent-identity
      dependsOn:
        - application
        - mcp-identity
      hooks:
        preprovision:
          shell: sh
          run: uv run --locked newsloom-platform prepare-agent-identity
          interactive: false
          continueOnError: false
    - name: agent
      path: infra/agent
      dependsOn:
        - agent-identity
        - application
        - mcp-identity
      hooks:
        preprovision:
          shell: sh
          run: uv run --locked newsloom-platform prepare-agent-layer
          interactive: false
          continueOnError: false
    - name: mcp-identity
      path: infra/mcp-identity
      dependsOn:
        - bootstrap
    - name: bootstrap
      path: infra/bootstrap
    - name: application
      path: infra
      dependsOn:
        - bootstrap
    - name: migrations
      path: infra/migrations
      dependsOn:
        - application
      hooks:
        preprovision:
          shell: sh
          run: uv run --locked newsloom-platform build
          interactive: false
          continueOnError: false
        postprovision:
          shell: sh
          run: uv run --locked newsloom-platform execute
          interactive: false
          continueOnError: false
    - name: ingestion
      path: infra/ingestion
      dependsOn:
        - migrations
      hooks:
        preprovision:
          shell: sh
          run: uv run --locked newsloom-platform build-ingestion
          interactive: false
          continueOnError: false
    - name: enrichment
      path: infra/enrichment
      dependsOn:
        - migrations
        - ingestion
      hooks:
        preprovision:
          shell: sh
          run: uv run --locked newsloom-platform build-enrichment
          interactive: false
          continueOnError: false
    - name: mcp
      path: infra/mcp
      dependsOn:
        - mcp-identity
        - migrations
      hooks:
        preprovision:
          shell: sh
          run: uv run --locked newsloom-platform build-mcp
          interactive: false
          continueOnError: false
    - name: phase1-acceptance
      path: infra/phase1-acceptance
      dependsOn:
        - migrations
      hooks:
        preprovision:
          shell: sh
          run: uv run --locked newsloom-platform prepare-phase1-layer
          interactive: false
          continueOnError: false
hooks:
  preprovision:
    shell: sh
    run: bash scripts/check.sh
    interactive: false
    continueOnError: false
  predeploy:
    shell: sh
    run: bash scripts/check.sh
    interactive: false
    continueOnError: false
