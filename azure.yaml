# yaml-language-server: $schema=https://aka.ms/azure-dev/schema.json
name: newsloom
metadata:
  template: newsloom
infra:
  provider: terraform
  layers:
    - name: bootstrap
      path: infra/bootstrap
    - name: application
      path: infra
      dependsOn:
        - bootstrap
    - name: migrations
      path: infra/migrations
      dependsOn:
        - application
      hooks:
        preprovision:
          shell: sh
          run: uv run --locked newsloom-platform build
          interactive: false
          continueOnError: false
        postprovision:
          shell: sh
          run: uv run --locked newsloom-platform execute
          interactive: false
          continueOnError: false
    - name: ingestion
      path: infra/ingestion
      dependsOn:
        - migrations
      hooks:
        preprovision:
          shell: sh
          run: uv run --locked newsloom-platform build-ingestion
          interactive: false
          continueOnError: false
hooks:
  preprovision:
    shell: sh
    run: bash scripts/check.sh
    interactive: false
    continueOnError: false
  predeploy:
    shell: sh
    run: bash scripts/check.sh
    interactive: false
    continueOnError: false
