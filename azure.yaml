# yaml-language-server: $schema=https://aka.ms/azure-dev/schema.json
name: newsloom
metadata:
  template: newsloom
infra:
  provider: terraform
  path: infra
hooks:
  preprovision:
    shell: sh
    run: bash scripts/check.sh
