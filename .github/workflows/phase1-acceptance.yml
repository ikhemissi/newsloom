name: Phase 1 isolated Azure acceptance

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Explicit operator-prepared 32-hex acceptance run ID
        required: true
        type: string
      scenario:
        description: Fixed acceptance run or negative drill (drills intentionally fail)
        required: true
        default: acceptance
        type: choice
        options:
          - acceptance
          - failure-after-ingestion
          - cancel-after-claim

permissions:
  contents: read

concurrency:
  group: phase1-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PHASE1_RUN_ID: ${{ inputs.run_id }}
      PHASE1_SCENARIO: ${{ inputs.scenario }}
      PHASE1_CLIENT_ID: ${{ vars.PHASE1_CLIENT_ID }}
      PHASE1_JOB_ID: ${{ vars.PHASE1_JOB_ID }}
      PHASE1_IMAGE: ${{ vars.PHASE1_IMAGE }}
      PHASE1_IMAGE_REVISION: ${{ vars.PHASE1_IMAGE_REVISION }}
      PHASE1_FIXTURE_REVISION: ${{ vars.PHASE1_FIXTURE_REVISION }}
      PHASE1_SCHEMA_REVISION: ${{ vars.PHASE1_SCHEMA_REVISION }}
      PHASE1_MODEL_REVISION: ${{ vars.PHASE1_MODEL_REVISION }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Mask private resource identifiers in workflow output
        shell: python
        run: |
          import os
          for name in ("PHASE1_CLIENT_ID", "AZURE_TENANT_ID", "AZURE_SUBSCRIPTION_ID",
                       "PHASE1_JOB_ID", "PHASE1_IMAGE"):
              value = os.environ.get(name, "")
              if value:
                  escaped = value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::add-mask::" + escaped)
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.PHASE1_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install the tested preview job-log client
        run: az extension add --name containerapp --version 1.3.0b4 --upgrade --yes --only-show-errors
      - name: Run isolated real-model integration
        run: uv run --locked python scripts/phase1_workflow.py run
      - name: Verify exact cleanup, including failed or cancelled executions
        if: always()
        run: uv run --locked python scripts/phase1_workflow.py cleanup
      - name: Retain only the scrubbed stage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phase1-acceptance-report
          path: ${{ runner.temp }}/newsloom-phase1-report.json
          if-no-files-found: error
          retention-days: 7
