[project]
name = "newsloom-agent-evaluation-tools"
version = "0.1.0"
description = "Operator-only synthetic DeepEval and Foundry evaluation tooling."
requires-python = ">=3.15,<3.16"
dependencies = [
    "azure-ai-projects==2.9.0",
    "azure-core==1.41.0",
    "azure-identity==1.26.0",
    "deepeval==4.3.2",
    "httpx==0.28.1",
    "httpx2==2.16.0",
    "openai==3.39.0",
    "opentelemetry-api==1.45.1",
    "pydantic==2.14.1",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.1",
]

[tool.uv]
package = false
required-version = ">=0.13.5"

[tool.ruff]
extend = "../../pyproject.toml"

[tool.mypy]
python_version = "3.15"
strict = true
plugins = ["pydantic.mypy"]
files = ["agent_evaluation", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-config --strict-markers -p no:deepeval"
