[project]
name = "newsloom-briefing"
version = "0.1.0"
description = "Scheduled shared weekly-news briefing."
requires-python = ">=3.15,<3.16"
dependencies = [
    "aiohttp>=3.12,<4",
    "azure-identity>=1.25,<2",
    "httpx>=0.28,<1",
    "newsloom-core",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.12,<3",
    "tiktoken>=0.12,<1",
]

[project.scripts]
newsloom-briefing = "newsloom_briefing.cli:main"

[tool.uv.sources]
newsloom-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
