[project]
name = "newsloom-operations"
version = "0.1.0"
description = "Nightly database export, operating window and governance tag repair."
requires-python = ">=3.15,<3.16"
dependencies = [
    "azure-identity>=1.25,<2",
    "azure-storage-blob>=12.26,<13",
    "httpx>=0.28,<1",
    "newsloom-core",
    "psycopg[binary]>=3.3,<4",
]

[project.scripts]
newsloom-operations = "newsloom_operations.cli:main"

[tool.uv.sources]
newsloom-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
