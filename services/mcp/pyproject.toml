[project]
name = "newsloom-mcp"
version = "0.1.0"
description = "Newsloom MCP service package; implemented in the mcp-server slice."
requires-python = ">=3.15,<3.16"
dependencies = ["newsloom-core"]

[tool.uv.sources]
newsloom-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
