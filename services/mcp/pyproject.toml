[project]
name = "newsloom-mcp"
version = "0.1.0"
description = "Newsloom MCP service package; implemented in the mcp-server slice."
requires-python = ">=3.15,<3.16"
dependencies = [
    "aiohttp>=3.12,<4",
    "azure-identity>=1.25,<2",
    "azure-monitor-opentelemetry-exporter>=1.0.0b50,<2",
    "httpx>=0.28,<1",
    "mcp==2.3.0",
    "newsloom-core",
    "opentelemetry-sdk>=1.39,<2",
    "psycopg[binary]>=3.3,<4",
    "pyjwt[crypto]==2.15.1",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
]

[project.scripts]
newsloom-mcp = "newsloom_mcp.cli:main"

[tool.uv.sources]
newsloom-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
