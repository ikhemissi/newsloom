[project]
name = "newsloom-ingestion"
version = "0.1.0"
description = "Newsloom ingestion job package; implemented in the feed-ingestion slice."
requires-python = ">=3.15,<3.16"
dependencies = [
    "aiohttp>=3.12,<4",
    "azure-identity>=1.25,<2",
    "azure-monitor-opentelemetry-exporter>=1.0.0b50,<2",
    "httpx>=0.28,<1",
    "newsloom-core",
    "opentelemetry-sdk>=1.39,<2",
    "psycopg[binary]>=3.3,<4",
]

[project.scripts]
newsloom-ingestion = "newsloom_ingestion.cli:main"

[tool.uv.sources]
newsloom-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
